[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "cragkit"
version = "1.0.0rc2"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
description = "Native Python retrieval with source-linked evidence, coverage estimates and execution diagnostics."
readme = "README.md"
authors = [{ name = "Vaibhav Suman" }]
requires-python = ">=3.14,<3.15"
dependencies = ["pydantic==2.14.1"]

[project.urls]
Homepage = "https://github.com/vsuman00/Cragkit"
Repository = "https://github.com/vsuman00/Cragkit"
Issues = "https://github.com/vsuman00/Cragkit/issues"

[project.optional-dependencies]
postgres = ["psycopg[binary]==3.3.6", "psycopg-pool==3.3.3"]
qdrant = ["httpx==0.28.1"]
tokenizers = [
    "tiktoken==0.14.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "psycopg[binary]==3.3.6",
    "psycopg-pool==3.3.3",
    "pytest==9.1.1",
    "mypy==2.4.0",
    "build==1.6.1",
    "jsonschema==4.26.0",
    "tiktoken==0.14.0",
]

[tool.mypy]
python_version = "3.14"
strict = true

[tool.hatch.build.targets.wheel]
packages = ["src/cragkit"]
