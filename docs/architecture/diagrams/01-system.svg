<rect x="525" y="130" width="350" height="96" rx="12" fill="#f1e8dd" stroke="#b8c5bd"/>
<text x="543" y="159" font-family="sans-serif" font-size="19" font-weight="600" fill="#253b35">Your application</text>
<text x="543" y="184" font-family="sans-serif" font-size="15" fill="#3f5049">Authentication and trusted scope</text>
<text x="543" y="204" font-family="sans-serif" font-size="15" fill="#3f5049">Final-answer generation and actions</text>
<rect x="100" y="300" width="350" height="96" rx="12" fill="#e5ede8" stroke="#b8c5bd"/>
<text x="118" y="329" font-family="sans-serif" font-size="19" font-weight="600" fill="#253b35">Python library</text>
<text x="118" y="354" font-family="sans-serif" font-size="15" fill="#3f5049">Pydantic + asyncio</text>
<text x="118" y="374" font-family="sans-serif" font-size="15" fill="#3f5049">Native execution in the Python process</text>
<rect x="950" y="300" width="350" height="96" rx="12" fill="#e5ede8" stroke="#b8c5bd"/>
<text x="968" y="329" font-family="sans-serif" font-size="19" font-weight="600" fill="#253b35">TypeScript library</text>
<text x="968" y="354" font-family="sans-serif" font-size="15" fill="#3f5049">Zod + async / AbortSignal</text>
<text x="968" y="374" font-family="sans-serif" font-size="15" fill="#3f5049">Native execution in the Node process</text>
<rect x="525" y="300" width="350" height="96" rx="12" fill="#f1e8dd" stroke="#b8c5bd"/>
<text x="543" y="329" font-family="sans-serif" font-size="19" font-weight="600" fill="#253b35">Shared specification</text>
<text x="543" y="354" font-family="sans-serif" font-size="15" fill="#3f5049">Schemas, policies and golden fixtures</text>
<text x="543" y="374" font-family="sans-serif" font-size="15" fill="#3f5049">Behavioral parity, no Python service</text>
<rect x="525" y="470" width="350" height="96" rx="12" fill="#e5ede8" stroke="#b8c5bd"/>
<text x="543" y="499" font-family="sans-serif" font-size="19" font-weight="600" fill="#253b35">Same logical pipeline</text>
<text x="543" y="524" font-family="sans-serif" font-size="15" fill="#3f5049">Plan &gt; search &gt; fuse &gt; rerank &gt; assess</text>
<text x="543" y="544" font-family="sans-serif" font-size="15" fill="#3f5049">Bounded correction &gt; extractive packing</text>
<rect x="100" y="650" width="350" height="96" rx="12" fill="#e5eaf2" stroke="#b8c5bd"/>
<text x="118" y="679" font-family="sans-serif" font-size="19" font-weight="600" fill="#253b35">PostgreSQL reference adapter</text>
<text x="118" y="704" font-family="sans-serif" font-size="15" fill="#3f5049">Canonical revisions + pgvector + FTS</text>
<text x="118" y="724" font-family="sans-serif" font-size="15" fill="#3f5049">Scoped reads; atomic publication</text>
<rect x="525" y="650" width="350" height="96" rx="12" fill="#f1e8dd" stroke="#b8c5bd"/>
<text x="543" y="679" font-family="sans-serif" font-size="19" font-weight="600" fill="#253b35">Configured model adapters</text>
<text x="543" y="704" font-family="sans-serif" font-size="15" fill="#3f5049">Embeddings, reranker, optional planner</text>
<text x="543" y="724" font-family="sans-serif" font-size="15" fill="#3f5049">Local or explicitly allowed remote calls</text>
<rect x="950" y="650" width="350" height="96" rx="12" fill="#e5eaf2" stroke="#b8c5bd"/>
<text x="968" y="679" font-family="sans-serif" font-size="19" font-weight="600" fill="#253b35">Qdrant alternative adapter</text>
<text x="968" y="704" font-family="sans-serif" font-size="15" fill="#3f5049">Dense / declared sparse profile</text>
<text x="968" y="724" font-family="sans-serif" font-size="15" fill="#3f5049">SourceStore + publication manifest</text>
<rect x="525" y="820" width="350" height="96" rx="12" fill="#f1e8dd" stroke="#b8c5bd"/>
<text x="543" y="849" font-family="sans-serif" font-size="19" font-weight="600" fill="#253b35">Diagnostics and integrations</text>
<text x="543" y="874" font-family="sans-serif" font-size="15" fill="#3f5049">Redacted events and evaluation</text>
<text x="543" y="894" font-family="sans-serif" font-size="15" fill="#3f5049">Optional tools / MCP use the engine</text>
<text x="60" y="970" font-family="sans-serif" font-size="16" fill="#52605b">Proposed architecture; modules are not separate services. Ingestion is a separate write path (see ingestion view).</text>
<text x="60" y="994" font-family="sans-serif" font-size="16" fill="#52605b">Python and TypeScript share contracts and fixtures. Framework adapters and MCP remain optional.</text>
