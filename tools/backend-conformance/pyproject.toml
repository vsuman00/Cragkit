[project]
name = "cragkit-backend-conformance"
version = "0.0.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "cragkit[postgres,qdrant,tokenizers]==0.0.0",
    "cragkit-langchain==0.0.0",
    "cragkit-mcp==0.0.0",
]

[tool.uv]
package = false

[tool.uv.sources]
cragkit = { path = "../../packages/python", editable = true }
cragkit-langchain = { path = "../../packages/langchain-python", editable = true }
cragkit-mcp = { path = "../../packages/mcp-python", editable = true }
