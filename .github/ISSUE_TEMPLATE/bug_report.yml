name: Bug report
description: Reproduce a Cragkit problem with synthetic input and redacted diagnostics.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Use synthetic input only. Never submit keys, tokens, passwords, database connection strings, raw private queries or documents.
        This form serves collaborators with repository access. It is not a confidential security channel or a response-time promise.
        Search existing issues first. Complete every requested reproduction field and the redaction check; mark unavailable values as unknown. Maintainers review completeness and redaction even when fields are marked required.
        Start with [contribution guidance](https://github.com/vsuman00/Cragkit/blob/main/CONTRIBUTING.md) and [support scope](https://github.com/vsuman00/Cragkit/blob/main/docs/support.md).
        For a suspected authorization bypass, credential exposure or other security issue, do not post sensitive details here. Request a private exchange through an existing trusted maintainer contact; no confidential inbox or private-reporting feature is assumed.
  - type: input
    id: package-version
    attributes:
      label: Package versions or source commit
      description: Name each affected core, LangChain or MCP package and its exact version; include install method or source commit.
      placeholder: "cragkit Python 1.0.0rc1 from PyPI; cragkit npm 1.0.0-rc.1"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Runtime and platform
      description: Include OS, architecture, Python or Node, npm or uv version, and backend or driver versions. Do not paste connection settings.
      placeholder: |
        OS and architecture:
        Python or Node:
        npm or uv:
        Backend and driver version:
    validations:
      required: true
  - type: textarea
    id: profile
    attributes:
      label: Enabled profile and provider mode
      description: List optional extras, adapters, tokenizer or embedding profile, and fake, recorded, local or live provider mode. No credentials or private endpoints.
      placeholder: "Core with PostgreSQL and lexical retrieval; fake transport; no model calls."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal synthetic reproduction
      description: Give exact commands, working directory and a small synthetic document, request, trusted scope and required filters with invented identities. Make prerequisites explicit; routine reproduction should not need a paid call.
      placeholder: |
        1. Install the stated version or check out the stated commit.
        2. Create synthetic input and a fake provider.
        3. Run the smallest command that shows the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: State the expected evidence, authorization, coverage estimate or execution outcome.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and safe status
      description: Include sufficient, partial or insufficient separately from complete or degraded when available, plus safe error codes and whether fallback was enabled. Say unknown when unavailable.
    validations:
      required: true
  - type: textarea
    id: regression
    attributes:
      label: Regression range and checks
      description: Optional frequency, last working version, synthetic check or test path, commands run and results. Distinguish unrun checks and local, native-backend, live-provider or installed-artifact evidence.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Short redacted logs
      description: Optional short redacted output or safe diagnostic codes. Remove credentials, connection strings, private endpoints, queries, document contents and raw provider errors before sharing.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: redaction
    attributes:
      label: Safe reproduction check
      options:
        - label: I used synthetic input and removed credentials, connection strings and private source or query data from this report.
          required: true
