name: Candidate validation

on:
  workflow_dispatch:
    inputs:
      runner_cost_acknowledged:
        description: 'Confirm this one bounded job is covered by free usage or an approved budget.'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: candidate-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  darwin-arm64:
    if: inputs.runner_cost_acknowledged
    runs-on: macos-15
    timeout-minutes: 25
    env:
      UV_PYTHON: '3.14.6'
      UV_PYTHON_DOWNLOADS: never
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.6'
          architecture: arm64
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.5.0'
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.8'
          enable-cache: false
      - name: Pin npm and record runner identity
        run: |
          npm install --global --ignore-scripts npm@11.17.0
          test "$(uname -m)" = arm64
          sw_vers
          python --version
          node --version
          npm --version
          uv --version
      - name: Check public packages serially
        run: python tools/check_public_packages.py --allow-downloads --output-dir artifacts/ci/public-packages
