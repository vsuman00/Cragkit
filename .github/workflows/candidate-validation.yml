name: Candidate validation

on:
  workflow_dispatch:
    inputs:
      runner_cost_acknowledged:
        description: 'Confirm this one bounded job is covered by free usage or an approved budget.'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: candidate-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  darwin-arm64:
    if: inputs.runner_cost_acknowledged
    runs-on: macos-15
    timeout-minutes: 25
    env:
      UV_PYTHON: '3.14.6'
      UV_PYTHON_DOWNLOADS: never
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.6'
          architecture: arm64
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.5.0'
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.8'
          enable-cache: false
      - name: Pin npm and record runner identity
        run: |
          npm install --global --ignore-scripts npm@11.17.0
          test "$(uname -m)" = arm64
          sw_vers
          python --version
          node --version
          npm --version
          uv --version
      - name: Validate core and LangChain serially
        run: python tools/check_sdk_packages.py --artifacts-dir artifacts/ci/sdks
      - name: Prepare optional MCP from frozen locks
        run: |
          uv sync --project packages/mcp-python --frozen
          npm --prefix packages/mcp-typescript ci --ignore-scripts --no-audit --no-fund
      - name: Validate MCP serially
        run: |
          uv run --project packages/mcp-python --frozen --no-sync mypy --config-file packages/mcp-python/pyproject.toml packages/mcp-python/src/cragkit_mcp
          uv run --project packages/mcp-python --frozen --no-sync pytest packages/mcp-python/tests -q
          npm --prefix packages/mcp-typescript test
      - name: Check entry points after all native SDK builds
        run: >-
          uv run --project packages/python --frozen --no-sync pytest
          tools/tests/test_backend_conformance.py::test_node_entrypoint_resolves_checkout_dependencies_before_input
          tools/tests/test_check_qdrant.py::test_explicit_node_candidate_import_has_no_driver_or_io -q
      - name: Validate exact optional artifacts and installation profiles
        run: python tools/check_qdrant_artifacts.py --core-artifacts artifacts/ci/sdks/core --output-dir artifacts/ci/optional
      - name: Bound retained artifact upload
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          entries = list(Path('artifacts/ci').rglob('*'))
          if any(path.is_symlink() for path in entries):
              raise SystemExit('Candidate artifact links are not allowed.')
          files = [path for path in entries if path.is_file()
                   and path.name.endswith(('.json', '.whl', '.tar.gz', '.tgz'))]
          total = sum(path.stat().st_size for path in files)
          if not files or len(files) > 100 or total > 100 * 1024 * 1024:
              raise SystemExit('Candidate artifacts exceed the approved upload limits.')
          print(json.dumps({'artifact_files': len(files), 'upload_bytes': total}))
          PY
      - name: Retain candidate archives and reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ github.sha }}
          path: |
            artifacts/ci/**/*.json
            artifacts/ci/**/*.whl
            artifacts/ci/**/*.tar.gz
            artifacts/ci/**/*.tgz
          retention-days: 1
          if-no-files-found: error
