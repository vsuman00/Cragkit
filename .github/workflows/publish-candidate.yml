name: Publish reviewed RC1

on:
  workflow_dispatch:
    inputs:
      publication_authorized:
        description: 'Approve the nine reviewed public RC1 files and their disclosure.'
        type: boolean
        required: true
        default: false
      runner_cost_acknowledged:
        description: 'Approve this one private Linux job, timeout 20 minutes, and receipt storage.'
        type: boolean
        required: true
        default: false
      registry_setup_confirmed:
        description: 'Confirm six project permissions, trusted publishers and secure bootstrap were verified.'
        type: boolean
        required: true
        default: false
      reviewed_workflow_sha:
        description: 'Full reviewed main commit, equal to this dispatch commit.'
        type: string
        required: true
      transport_release_id:
        description: 'Approved private draft release ID for the retained RC1 transport.'
        type: string
        required: true
      transport_asset_id:
        description: 'Approved release-transport.zip asset ID.'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: publish-reviewed-rc1
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'vsuman00/Cragkit' &&
      github.actor == 'vsuman00' &&
      github.event.repository.private == true &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      inputs.reviewed_workflow_sha == github.sha &&
      inputs.publication_authorized && inputs.runner_cost_acknowledged &&
      inputs.registry_setup_confirmed && vars.CRAGKIT_RELEASE_ENABLED == 'reviewed-rc1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
      PUBLICATION_AUTHORIZED: ${{ inputs.publication_authorized }}
      RUNNER_COST_ACKNOWLEDGED: ${{ inputs.runner_cost_acknowledged }}
      REGISTRY_SETUP_CONFIRMED: ${{ inputs.registry_setup_confirmed }}
      REVIEWED_WORKFLOW_SHA: ${{ inputs.reviewed_workflow_sha }}
      CRAGKIT_RELEASE_ENABLED: ${{ vars.CRAGKIT_RELEASE_ENABLED }}
      TRANSPORT_RELEASE_ID: ${{ inputs.transport_release_id }}
      TRANSPORT_ASSET_ID: ${{ inputs.transport_asset_id }}
    steps:
      - name: Check out the reviewed workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up the pinned Python upload toolchain
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.6'
      - name: Set up the pinned Node upload toolchain
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.5.0'
          package-manager-cache: false
      - name: Validate admission before reading a private asset
        run: python tools/publication_workflow.py guard
      - name: Verify the approved private draft and asset metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir .release-download
          gh api "repos/vsuman00/Cragkit/releases/${TRANSPORT_RELEASE_ID}" > .release-download/release.json
          gh api "repos/vsuman00/Cragkit/releases/assets/${TRANSPORT_ASSET_ID}" > .release-download/asset.json
          python tools/publication_workflow.py asset --release .release-download/release.json --asset .release-download/asset.json
      - name: Fetch only the approved private asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api -H 'Accept: application/octet-stream'
          "repos/vsuman00/Cragkit/releases/assets/${TRANSPORT_ASSET_ID}"
          > .release-download/release-transport.zip
      - name: Revalidate retained inputs and reproduce exact products
        run: >-
          python tools/release_transport.py unpack
          --archive .release-download/release-transport.zip
          --expected-sha256 6b817c8c627e1cdd0fe882b25617b2be17fe6ff7dc75e45b3d8a26d69c0db0d0
          --output .release-candidate
      - name: Pin npm without running package hooks
        run: npm install --global --ignore-scripts --no-audit --no-fund npm@11.17.0
      - name: Verify all present registry files before upload
        run: python tools/check_registry_products.py --allow-missing --output .release-preflight
      - name: Select only reviewed missing files
        id: plan
        run: >-
          python tools/publication_workflow.py plan
          --prepared .release-candidate
          --report .release-preflight/registry-report.json
          --output .release-upload
      - name: Publish missing core Python files through its trusted publisher
        if: steps.plan.outputs.pypi_core == 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1 reviewed 2026-11-03
        with:
          packages-dir: .release-upload/pypi/cragkit
          skip-existing: false
          attestations: true
      - name: Publish missing LangChain Python files through its trusted publisher
        if: steps.plan.outputs.pypi_langchain == 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          packages-dir: .release-upload/pypi/cragkit-langchain
          skip-existing: false
          attestations: true
      - name: Publish missing MCP Python files through its trusted publisher
        if: steps.plan.outputs.pypi_mcp == 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          packages-dir: .release-upload/pypi/cragkit-mcp
          skip-existing: false
          attestations: true
      - name: Publish missing npm products through their trusted publishers
        run: >-
          python tools/publication_workflow.py npm
          --prepared .release-candidate --plan .release-upload/workflow-plan.json
      - name: Verify exact registry files and prerelease tags after publication
        run: python tools/check_registry_products.py --output .release-post
      - name: Retain nonsecret publication receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication-receipts-${{ github.run_id }}
          retention-days: 1
          if-no-files-found: ignore
          path: |
            .release-preflight/registry-report.json
            .release-upload/workflow-plan.json
            .release-post/registry-report.json
