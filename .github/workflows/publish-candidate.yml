name: Publish reviewed RC1

on:
  workflow_dispatch:
    inputs:
      publication_authorized:
        description: 'Approve the nine reviewed public RC1 files and their disclosure.'
        type: boolean
        required: true
        default: false
      runner_cost_acknowledged:
        description: 'Approve bounded private fetch and publication jobs, 5 and 20 minutes, and receipt storage.'
        type: boolean
        required: true
        default: false
      registry_setup_confirmed:
        description: 'Confirm selected PyPI binding, pending identity and required npm setup were verified.'
        type: boolean
        required: true
        default: false
      pypi_project:
        description: 'Select only the configured PyPI project; all requires all normal bindings.'
        type: choice
        required: true
        options:
          - cragkit
          - cragkit-langchain
          - cragkit-mcp
          - all
      pypi_pending_project:
        description: 'Current pending publisher project; none means normal bindings only.'
        type: choice
        required: true
        options:
          - none
          - cragkit
          - cragkit-langchain
          - cragkit-mcp
      reviewed_workflow_sha:
        description: 'Full reviewed main commit, equal to this dispatch commit.'
        type: string
        required: true
      transport_release_id:
        description: 'Approved private draft release ID for the retained RC1 transport.'
        type: string
        required: true
      transport_asset_id:
        description: 'Approved release-transport.zip asset ID.'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: publish-reviewed-rc1
  cancel-in-progress: false

jobs:
  fetch:
    if: >-
      github.repository == 'vsuman00/Cragkit' &&
      github.actor == 'vsuman00' &&
      github.event.repository.private == true &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      inputs.reviewed_workflow_sha == github.sha &&
      inputs.publication_authorized && inputs.runner_cost_acknowledged &&
      inputs.registry_setup_confirmed && vars.CRAGKIT_RELEASE_ENABLED == 'reviewed-rc1'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      id-token: none
    outputs:
      transport_artifact_id: ${{ steps.transport.outputs.artifact-id }}
    env:
      REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
      PUBLICATION_AUTHORIZED: ${{ inputs.publication_authorized }}
      RUNNER_COST_ACKNOWLEDGED: ${{ inputs.runner_cost_acknowledged }}
      REGISTRY_SETUP_CONFIRMED: ${{ inputs.registry_setup_confirmed }}
      REVIEWED_WORKFLOW_SHA: ${{ inputs.reviewed_workflow_sha }}
      CRAGKIT_RELEASE_ENABLED: ${{ vars.CRAGKIT_RELEASE_ENABLED }}
      TRANSPORT_RELEASE_ID: ${{ inputs.transport_release_id }}
      TRANSPORT_ASSET_ID: ${{ inputs.transport_asset_id }}
      PYPI_PROJECT: ${{ inputs.pypi_project }}
      PYPI_PENDING_PROJECT: ${{ inputs.pypi_pending_project }}
    steps:
      - name: Check out the reviewed workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up the pinned Python toolchain
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.6'
      - name: Validate independent job admission
        run: python tools/publication_workflow.py guard
      - name: Verify the approved private draft and asset metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir .release-download
          gh api "repos/vsuman00/Cragkit/releases/${TRANSPORT_RELEASE_ID}" > .release-download/release.json
          gh api "repos/vsuman00/Cragkit/releases/assets/${TRANSPORT_ASSET_ID}" > .release-download/asset.json
          python tools/publication_workflow.py asset --release .release-download/release.json --asset .release-download/asset.json
      - name: Fetch and verify only the sealed transport
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/octet-stream' "repos/vsuman00/Cragkit/releases/assets/${TRANSPORT_ASSET_ID}" | head -c 4194305 > .release-download/release-transport.zip
          test "$(wc -c < .release-download/release-transport.zip)" -eq 1496502
          echo '609f3f84924417d4c0e9baefeb2097e10d35cc5e1e43cc283add970a60545d48  .release-download/release-transport.zip' | sha256sum --check --status
      - name: Hand off only the verified sealed transport
        id: transport
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reviewed-rc1-transport-${{ github.run_id }}
          retention-days: 1
          if-no-files-found: error
          path: .release-download/release-transport.zip

  publish:
    needs: fetch
    if: >-
      github.repository == 'vsuman00/Cragkit' &&
      github.actor == 'vsuman00' &&
      github.event.repository.private == true &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      inputs.reviewed_workflow_sha == github.sha &&
      inputs.publication_authorized && inputs.runner_cost_acknowledged &&
      inputs.registry_setup_confirmed && vars.CRAGKIT_RELEASE_ENABLED == 'reviewed-rc1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
      PUBLICATION_AUTHORIZED: ${{ inputs.publication_authorized }}
      RUNNER_COST_ACKNOWLEDGED: ${{ inputs.runner_cost_acknowledged }}
      REGISTRY_SETUP_CONFIRMED: ${{ inputs.registry_setup_confirmed }}
      REVIEWED_WORKFLOW_SHA: ${{ inputs.reviewed_workflow_sha }}
      CRAGKIT_RELEASE_ENABLED: ${{ vars.CRAGKIT_RELEASE_ENABLED }}
      TRANSPORT_RELEASE_ID: ${{ inputs.transport_release_id }}
      TRANSPORT_ASSET_ID: ${{ inputs.transport_asset_id }}
      PYPI_PROJECT: ${{ inputs.pypi_project }}
      PYPI_PENDING_PROJECT: ${{ inputs.pypi_pending_project }}
      TRANSPORT_ARTIFACT_ID: ${{ needs.fetch.outputs.transport_artifact_id }}
    steps:
      - name: Check out the reviewed workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up the pinned Python toolchain
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.6'
      - name: Validate independent job admission
        run: python tools/publication_workflow.py guard
      - name: Verify same-run transport artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir .release-artifact
          gh api "repos/vsuman00/Cragkit/actions/artifacts/${TRANSPORT_ARTIFACT_ID}" > .release-artifact/metadata.json
          python tools/publication_workflow.py artifact --metadata .release-artifact/metadata.json
      - name: Fetch the bounded artifact and verify the sealed inner transport
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/vsuman00/Cragkit/actions/artifacts/${TRANSPORT_ARTIFACT_ID}/zip" | head -c 4194305 > .release-artifact/wrapper.zip
          python tools/publication_workflow.py unwrap-artifact --archive .release-artifact/wrapper.zip --output .release-download
      - name: Revalidate retained inputs and reproduce exact products
        run: >-
          python tools/release_transport.py unpack
          --archive .release-download/release-transport.zip
          --expected-sha256 609f3f84924417d4c0e9baefeb2097e10d35cc5e1e43cc283add970a60545d48
          --output .release-candidate
      - name: Set up the pinned Node upload toolchain
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.5.0'
          package-manager-cache: false
      - name: Pin npm without running package hooks
        run: npm install --global --ignore-scripts --no-audit --no-fund npm@11.17.0
      - name: Verify all present registry files before upload
        run: python tools/check_registry_products.py --allow-missing --output .release-preflight
      - name: Select only reviewed missing files
        id: plan
        run: >-
          python tools/publication_workflow.py plan
          --prepared .release-candidate
          --report .release-preflight/registry-report.json
          --output .release-upload
          --pypi-project "$PYPI_PROJECT"
      - name: Publish missing core Python files through its trusted publisher
        if: steps.plan.outputs.pypi_core == 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1 reviewed 2026-11-03
        with:
          packages-dir: .release-upload/pypi/cragkit
          skip-existing: false
          attestations: true
      - name: Publish missing LangChain Python files through its trusted publisher
        if: steps.plan.outputs.pypi_langchain == 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          packages-dir: .release-upload/pypi/cragkit-langchain
          skip-existing: false
          attestations: true
      - name: Publish missing MCP Python files through its trusted publisher
        if: steps.plan.outputs.pypi_mcp == 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          packages-dir: .release-upload/pypi/cragkit-mcp
          skip-existing: false
          attestations: true
      - name: Publish missing npm products through their trusted publishers
        run: >-
          python tools/publication_workflow.py npm
          --prepared .release-candidate --plan .release-upload/workflow-plan.json
      - name: Observe selected registry phase without retrying uploads
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            output=".release-post-${attempt}"
            python tools/check_registry_products.py --allow-missing --output "$output"
            if python tools/publication_workflow.py postflight --report "$output/registry-report.json" --pypi-project "$PYPI_PROJECT"; then
              exit 0
            else
              status=$?
            fi
            if [ "$status" -ne 2 ]; then exit "$status"; fi
            if [ "$attempt" -eq 10 ]; then exit 2; fi
            sleep 15
          done
      - name: Retain nonsecret publication receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication-receipts-${{ github.run_id }}
          retention-days: 1
          if-no-files-found: ignore
          path: |
            .release-preflight/registry-report.json
            .release-upload/workflow-plan.json
            .release-post-*/registry-report.json
